name: Player's Health
description: >-
  Player's Health is an insurance and athlete-safety technology company founded in 2016
  and based in Minneapolis, Minnesota, serving youth sports organizations, fitness
  facilities, schools, and collegiate athletic programs. The platform combines specialty
  insurance products (general liability, sexual abuse and molestation liability, accident
  medical, directors and officers, equipment and property, cyber, and employee benefits)
  with athlete-safety and risk-management tooling including coach credentialing and
  background checks, injury and incident reporting, investigations, mental-health support,
  and training. Player's Health operates login-gated web portals for claims, certificates
  of insurance, and safety/compliance (SafetyHub) rather than a public developer API. It
  is a Techstars-backed company surfaced through the API Evangelist network and profiled
  here for discovery.
